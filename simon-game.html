<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    .simon-btn { width: 120px; height: 120px; border-radius: 15px; opacity: 0.6; cursor: pointer; transition: opacity 0.2s; }
    .simon-btn.active { opacity: 1; transform: scale(1.05); }
    .green { background: #00ba7c; }
    .red { background: #f75c7e; }
    .yellow { background: #ffd166; }
    .blue { background: #1d9bf0; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Simon Says</h1>

    <div class="stats">
        <span>Etape: <strong id="simonStep">0</strong></span>
        <span>Record: <strong id="simonBest">0</strong></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, 120px); gap: 15px; margin: 15px 0;">
        <div id="btn0" class="simon-btn green" onclick="handleSimonClick(0)"></div>
        <div id="btn1" class="simon-btn red" onclick="handleSimonClick(1)"></div>
        <div id="btn2" class="simon-btn yellow" onclick="handleSimonClick(2)"></div>
        <div id="btn3" class="simon-btn blue" onclick="handleSimonClick(3)"></div>
    </div>
    <div id="simonMsg" style="height: 25px; font-size: 1.1rem; color: #1d9bf0;"></div>
    <button class="btn" onclick="startSimon()">Démarrer</button>
    <p class="instructions">Répétez la séquence de couleurs lumineuses dans l'ordre.</p>

    </div>
    <script>

    let simonSeq = [];
    let playerSeq = [];
    let simonBest = localStorage.getItem('simonBest') || 0;
    document.getElementById('simonBest').textContent = simonBest;
    let playing = false, acceptingInput = false;

    function startSimon() {
        simonSeq = [];
        nextRound();
    }

    function nextRound() {
        playerSeq = [];
        acceptingInput = false;
        document.getElementById('simonStep').textContent = simonSeq.length + 1;
        simonSeq.push(Math.floor(Math.random() * 4));
        playSequence();
    }

    function playSequence() {
        document.getElementById('simonMsg').textContent = 'Observez...';
        let i = 0;
        let interval = setInterval(() => {
            flashBtn(simonSeq[i]);
            i++;
            if (i >= simonSeq.length) {
                clearInterval(interval);
                setTimeout(() => {
                    acceptingInput = true;
                    document.getElementById('simonMsg').textContent = 'À votre tour !';
                }, 400);
            }
        }, 600);
    }

    function flashBtn(idx) {
        const btn = document.getElementById('btn' + idx);
        btn.classList.add('active');
        setTimeout(() => btn.classList.remove('active'), 300);
    }

    function handleSimonClick(idx) {
        if (!acceptingInput) return;
        flashBtn(idx);
        playerSeq.push(idx);

        if (playerSeq[playerSeq.length - 1] !== simonSeq[playerSeq.length - 1]) {
            document.getElementById('simonMsg').textContent = 'Erreur ! Partie terminée.';
            acceptingInput = false;
            return;
        }

        if (playerSeq.length === simonSeq.length) {
            if (simonSeq.length > simonBest) {
                simonBest = simonSeq.length;
                localStorage.setItem('simonBest', simonBest);
                document.getElementById('simonBest').textContent = simonBest;
            }
            document.getElementById('simonMsg').textContent = 'Bien joué !';
            setTimeout(nextRound, 1000);
        }
    }

    </script>
</body>
</html>
