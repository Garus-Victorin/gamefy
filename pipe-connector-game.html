<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipe Connect</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    .pipe-cell {
        width:60px; height:60px; background:#273340; border-radius:6px; display:flex;
        align-items:center; justify-content:center; font-size:2rem; cursor:pointer; color:#1d9bf0; transition:transform 0.2s;
    }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Pipe Connect</h1>

    <div id="pipeBoard" style="display:grid; grid-template-columns:repeat(4, 60px); gap:4px; background:#1e2732; padding:8px; border-radius:8px;"></div>
    <div id="pipeMsg" style="height:25px; margin-top:10px; color:#00ba7c; font-size:1.1rem;"></div>
    <button class="btn" onclick="initPipes()">Réinitialiser</button>
    <p class="instructions">Cliquez sur chaque section de tuyau pour la faire pivoter et relier l'entrée à la sortie.</p>

    </div>
    <script>

    const pipeTypes = ['│', '─', '┌', '┐', '└', '┘'];
    let pipeAngles = Array(16).fill(0);

    function initPipes() {
        pipeAngles = Array(16).fill(0).map(() => Math.floor(Math.random()*4)*90);
        document.getElementById('pipeMsg').textContent = '';
        renderPipes();
    }

    function renderPipes() {
        const board = document.getElementById('pipeBoard');
        board.innerHTML = '';
        pipeAngles.forEach((angle, idx) => {
            let cell = document.createElement('div');
            cell.className = 'pipe-cell';
            cell.textContent = '└';
            cell.style.transform = `rotate(${angle}deg)`;
            cell.onclick = () => {
                pipeAngles[idx] = (pipeAngles[idx] + 90) % 360;
                renderPipes();
                checkPipes();
            };
            board.appendChild(cell);
        });
    }

    function checkPipes() {
        if (pipeAngles.every(a => a % 180 === 0)) {
            document.getElementById('pipeMsg').textContent = 'Bravo ! Circuit d\'eau connecté !';
        }
    }

    initPipes();

    </script>
</body>
</html>
