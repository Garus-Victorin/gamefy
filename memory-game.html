<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1419; min-height: 100vh; display: flex;
      justify-content: center; align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif; color: #e7e9ea;
    }
    .wrap {
      background: #16202a; border: 1px solid #2f3b47; border-radius: 12px;
      padding: 24px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.4);
      max-width: 520px;
    }
    h1 { color: #39ff14; font-size: 22px; margin-bottom: 14px; }
    .hud { display: flex; justify-content: center; gap: 24px; margin-bottom: 16px; font-size: 15px; }
    .hud strong { color: #39ff14; }
    #grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    }
    .card {
      aspect-ratio: 1; border-radius: 10px; cursor: pointer;
      background: #1c2733; border: 2px solid #2f3b47;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; user-select: none;
      transition: transform 0.2s, background 0.2s, border-color 0.2s;
      transform-style: preserve-3d;
    }
    .card:hover:not(.flipped):not(.matched) { border-color: #39ff14; transform: scale(1.03); }
    .card .front, .card .back {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      border-radius: 8px; backface-visibility: hidden;
    }
    .card { position: relative; }
    .card .back {
      background: linear-gradient(135deg, #1a3a2a, #0f1419);
      color: #39ff14; font-size: 20px; font-weight: 700;
    }
    .card .front {
      background: #243040; transform: rotateY(180deg); font-size: 36px;
    }
    .card.flipped, .card.matched { transform: rotateY(180deg); }
    .card.matched { border-color: #39ff14; opacity: 0.85; cursor: default; }
    .card.flipped .front, .card.matched .front { background: #2a3a4a; }
    .msg { min-height: 24px; margin-top: 14px; color: #8ab4f8; font-size: 15px; }
    button {
      margin-top: 10px; background: #39ff14; color: #0a0e12; border: none;
      padding: 10px 28px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px;
    }
    .ctrl { margin-top: 12px; color: #6b7a88; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🧠 MEMORY</h1>
    <div class="hud">
      <span>Coups : <strong id="moves">0</strong></span>
      <span>Paires : <strong id="pairs">0</strong>/8</span>
      <span>Temps : <strong id="time">0</strong>s</span>
    </div>
    <div id="grid"></div>
    <div class="msg" id="msg">Trouve les paires</div>
    <button id="btn">Nouvelle partie</button>
    <div class="ctrl">Clique sur les cartes pour les retourner</div>
  </div>
  <script>
    const EMOJIS = ['🍎','🍋','🍇','🍉','🍒','🥝','🍑','🍍'];
    const grid = document.getElementById('grid');
    const movesEl = document.getElementById('moves');
    const pairsEl = document.getElementById('pairs');
    const timeEl = document.getElementById('time');
    const msg = document.getElementById('msg');

    let cards, flipped, lock, moves, pairs, started, timer, seconds;

    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function reset() {
      clearInterval(timer);
      const deck = shuffle([...EMOJIS, ...EMOJIS]);
      flipped = []; lock = false; moves = 0; pairs = 0;
      started = false; seconds = 0;
      movesEl.textContent = '0'; pairsEl.textContent = '0'; timeEl.textContent = '0';
      msg.textContent = 'Trouve les paires';
      grid.innerHTML = '';
      cards = deck.map((emoji, i) => {
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `<div class="back">?</div><div class="front">${emoji}</div>`;
        el.dataset.emoji = emoji;
        el.dataset.index = i;
        el.addEventListener('click', () => flip(el));
        grid.appendChild(el);
        return el;
      });
    }

    function startTimer() {
      if (started) return;
      started = true;
      timer = setInterval(() => {
        seconds++;
        timeEl.textContent = seconds;
      }, 1000);
    }

    function flip(el) {
      if (lock || el.classList.contains('flipped') || el.classList.contains('matched')) return;
      startTimer();
      el.classList.add('flipped');
      flipped.push(el);
      if (flipped.length < 2) return;

      moves++;
      movesEl.textContent = moves;
      lock = true;
      const [a, b] = flipped;
      if (a.dataset.emoji === b.dataset.emoji) {
        a.classList.add('matched');
        b.classList.add('matched');
        pairs++;
        pairsEl.textContent = pairs;
        flipped = [];
        lock = false;
        if (pairs === 8) {
          clearInterval(timer);
          msg.textContent = `Bravo ! ${moves} coups en ${seconds}s 🎉`;
        }
      } else {
        setTimeout(() => {
          a.classList.remove('flipped');
          b.classList.remove('flipped');
          flipped = [];
          lock = false;
        }, 700);
      }
    }

    document.getElementById('btn').onclick = reset;
    reset();
  </script>
</body>
</html>
