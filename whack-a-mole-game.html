<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whack-a-Mole</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1419; min-height: 100vh; display: flex;
      justify-content: center; align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif; color: #e7e9ea;
    }
    .wrap {
      background: #16202a; border: 1px solid #2f3b47; border-radius: 12px;
      padding: 24px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    h1 { color: #39ff14; font-size: 22px; margin-bottom: 14px; }
    .hud { display: flex; justify-content: center; gap: 28px; margin-bottom: 16px; font-size: 16px; }
    .hud strong { color: #39ff14; }
    #board {
      display: grid; grid-template-columns: repeat(3, 110px); gap: 14px;
      justify-content: center;
    }
    .hole {
      width: 110px; height: 110px; border-radius: 50%;
      background: radial-gradient(circle at 50% 30%, #3d2914, #1a1008);
      border: 3px solid #2f3b47; position: relative; overflow: hidden;
      cursor: pointer; box-shadow: inset 0 8px 16px rgba(0,0,0,.5);
    }
    .mole {
      position: absolute; left: 50%; bottom: -70%; transform: translateX(-50%);
      width: 70px; height: 70px; border-radius: 50% 50% 45% 45%;
      background: #8B4513; transition: bottom 0.12s ease-out;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; user-select: none;
    }
    .mole.up { bottom: 12%; }
    .mole.hit { background: #c0392b; transform: translateX(-50%) scale(0.9); }
    .msg { min-height: 24px; margin-top: 14px; color: #8ab4f8; font-size: 15px; }
    button {
      margin-top: 10px; background: #39ff14; color: #0a0e12; border: none;
      padding: 10px 28px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px;
    }
    button:hover { background: #2dd60f; }
    .ctrl { margin-top: 12px; color: #6b7a88; font-size: 13px; }
    .hammer { cursor: crosshair; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🔨 WHACK-A-MOLE</h1>
    <div class="hud">
      <span>Score : <strong id="sc">0</strong></span>
      <span>Temps : <strong id="tm">30</strong>s</span>
      <span>Record : <strong id="hs">0</strong></span>
    </div>
    <div id="board" class="hammer"></div>
    <div class="msg" id="msg">Clique sur Démarrer</div>
    <button id="btn">Démarrer</button>
    <div class="ctrl">Clique sur les taupes le plus vite possible</div>
  </div>
  <script>
    const board = document.getElementById('board');
    const scEl = document.getElementById('sc');
    const tmEl = document.getElementById('tm');
    const hsEl = document.getElementById('hs');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');

    let holes = [], score, timeLeft, running, spawnTimer, clockTimer, active = new Set();
    let high = Number(localStorage.getItem('moleHS') || 0);
    hsEl.textContent = high;

    for (let i = 0; i < 9; i++) {
      const hole = document.createElement('div');
      hole.className = 'hole';
      const mole = document.createElement('div');
      mole.className = 'mole';
      mole.textContent = '🦫';
      mole.dataset.index = i;
      hole.appendChild(mole);
      hole.addEventListener('click', () => whack(mole));
      board.appendChild(hole);
      holes.push(mole);
    }

    function whack(mole) {
      if (!running || !mole.classList.contains('up')) return;
      mole.classList.remove('up');
      mole.classList.add('hit');
      score++;
      scEl.textContent = score;
      active.delete(Number(mole.dataset.index));
      setTimeout(() => mole.classList.remove('hit'), 150);
    }

    function showMole() {
      if (!running) return;
      const free = holes.map((_, i) => i).filter(i => !active.has(i));
      if (!free.length) return;
      const idx = free[Math.floor(Math.random() * free.length)];
      const mole = holes[idx];
      active.add(idx);
      mole.classList.add('up');
      const upTime = Math.max(450, 900 - score * 15);
      setTimeout(() => {
        mole.classList.remove('up');
        active.delete(idx);
      }, upTime);
    }

    function start() {
      clearInterval(spawnTimer);
      clearInterval(clockTimer);
      score = 0; timeLeft = 30; running = true; active.clear();
      scEl.textContent = '0'; tmEl.textContent = '30';
      msg.textContent = 'Tape les taupes !';
      btn.textContent = 'Rejouer';
      holes.forEach(m => m.classList.remove('up', 'hit'));

      spawnTimer = setInterval(showMole, 700);
      showMole();
      clockTimer = setInterval(() => {
        timeLeft--;
        tmEl.textContent = timeLeft;
        if (timeLeft <= 0) end();
      }, 1000);
    }

    function end() {
      running = false;
      clearInterval(spawnTimer);
      clearInterval(clockTimer);
      holes.forEach(m => m.classList.remove('up'));
      active.clear();
      if (score > high) {
        high = score;
        hsEl.textContent = high;
        localStorage.setItem('moleHS', String(high));
        msg.textContent = `Nouveau record : ${score} ! 🎉`;
      } else {
        msg.textContent = `Terminé — Score : ${score}`;
      }
    }

    btn.onclick = start;
  </script>
</body>
</html>
