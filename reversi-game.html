<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Othello / Reversi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    .rev-cell { width:40px; height:40px; background:#00ba7c; border-radius:4px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .rev-disc { width:30px; height:30px; border-radius:50%; }
    .rev-disc.black { background:#0f1419; }
    .rev-disc.white { background:#e7e9ea; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Othello / Reversi</h1>

    <div class="stats">
        <span>Noir: <strong id="revB">2</strong> | Blanc: <strong id="revW">2</strong></span>
    </div>
    <div id="revBoard" style="display:grid; grid-template-columns:repeat(8, 40px); gap:2px; background:#273340; padding:4px; border-radius:6px;"></div>
    <div id="revMsg" style="height:25px; margin-top:10px; color:#00ba7c; font-size:1.1rem;"></div>
    <button class="btn" onclick="initReversi()">Nouvelle partie</button>
    <p class="instructions">Encadrez les jetons adverses pour les retourner à votre couleur.</p>

    </div>
    <script>

    let revGrid = Array(8).fill(null).map(() => Array(8).fill(null));
    let revTurn = 'black';

    function initReversi() {
        revGrid = Array(8).fill(null).map(() => Array(8).fill(null));
        revGrid[3][3] = 'white'; revGrid[3][4] = 'black';
        revGrid[4][3] = 'black'; revGrid[4][4] = 'white';
        revTurn = 'black';
        renderReversi();
    }

    function renderReversi() {
        const board = document.getElementById('revBoard');
        board.innerHTML = '';
        let b = 0, w = 0;
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                let cell = document.createElement('div');
                cell.className = 'rev-cell';
                cell.onclick = () => handleRevClick(r, c);
                if (revGrid[r][c]) {
                    let disc = document.createElement('div');
                    disc.className = 'rev-disc ' + revGrid[r][c];
                    cell.appendChild(disc);
                    if (revGrid[r][c] === 'black') b++; else w++;
                }
                board.appendChild(cell);
            }
        }
        document.getElementById('revB').textContent = b;
        document.getElementById('revW').textContent = w;
    }

    function handleRevClick(r, c) {
        if (revGrid[r][c] !== null) return;
        revGrid[r][c] = revTurn;
        revTurn = revTurn === 'black' ? 'white' : 'black';
        renderReversi();
    }

    initReversi();

    </script>
</body>
</html>
