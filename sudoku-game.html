<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    .sdk-cell {
        width: 36px; height: 36px; background: #161e27; display: flex; align-items: center; justify-content: center;
        font-size: 1.1rem; font-weight: bold; color: #1d9bf0;
    }
    .sdk-cell input {
        width: 100%; height: 100%; background: transparent; border: none; text-align: center;
        color: #e7e9ea; font-size: 1.1rem; font-weight: bold; outline: none;
    }
    .sdk-cell.given { background: #1e2732; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Sudoku</h1>

    <div class="stats">
        <span>Difficulté: <strong>Facile</strong></span>
    </div>
    <div id="sudokuGrid" style="display: grid; grid-template-columns: repeat(9, 36px); gap: 1px; background: #8b98a5; padding: 2px; border-radius: 4px;"></div>
    <div id="sudokuMsg" style="margin-top: 10px; font-size: 1.1rem; height: 25px; color: #00ba7c;"></div>
    <button class="btn" onclick="initSudoku()">Nouveau Sudoku</button>
    <p class="instructions">Remplissez les cases de 1 à 9 sans répétition par ligne, colonne ou carré 3x3.</p>

    </div>
    <script>

    const sampleBoards = [
        [
            [5,3,0, 0,7,0, 0,0,0],
            [6,0,0, 1,9,5, 0,0,0],
            [0,9,8, 0,0,0, 0,6,0],
            [8,0,0, 0,6,0, 0,0,3],
            [4,0,0, 8,0,3, 0,0,1],
            [7,0,0, 0,2,0, 0,0,6],
            [0,6,0, 0,0,0, 2,8,0],
            [0,0,0, 4,1,9, 0,0,5],
            [0,0,0, 0,8,0, 0,7,9]
        ]
    ];

    let currentBoard = [];

    function initSudoku() {
        document.getElementById('sudokuMsg').textContent = '';
        currentBoard = JSON.parse(JSON.stringify(sampleBoards[0]));
        renderSudoku();
    }

    function renderSudoku() {
        const gridEl = document.getElementById('sudokuGrid');
        gridEl.innerHTML = '';
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                const cell = document.createElement('div');
                cell.className = 'sdk-cell' + (currentBoard[r][c] !== 0 ? ' given' : '');

                // Border styling for 3x3
                if ((c + 1) % 3 === 0 && c < 8) cell.style.marginRight = '2px';
                if ((r + 1) % 3 === 0 && r < 8) cell.style.marginBottom = '2px';

                if (currentBoard[r][c] !== 0) {
                    cell.textContent = currentBoard[r][c];
                } else {
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.oninput = (e) => {
                        let val = parseInt(e.target.value);
                        if (isNaN(val) || val < 1 || val > 9) e.target.value = '';
                        else checkSudokuCompletion();
                    };
                    cell.appendChild(input);
                }
                gridEl.appendChild(cell);
            }
        }
    }

    function checkSudokuCompletion() {
        // Quick dummy check or full solver validation
        document.getElementById('sudokuMsg').textContent = 'Case complétée !';
    }

    initSudoku();

    </script>
</body>
</html>
