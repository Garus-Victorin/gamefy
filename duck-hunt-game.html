<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Hunt</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    .duck { width:35px; height:35px; background:#ffd166; border-radius:50%; position:absolute; cursor:pointer; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Duck Hunt</h1>

    <div class="stats">Canards touchés: <strong id="duckScore">0</strong></div>
    <div id="duckArea" style="width:350px; height:320px; background:#1d9bf0; border-radius:8px; position:relative; overflow:hidden; cursor:crosshair;"></div>
    <button class="btn" onclick="initDuckHunt()">Lancer canard</button>
    <p class="instructions">Cliquez sur les canards jaunes qui s'envolent à toute vitesse !</p>

    </div>
    <script>

    let duckScore = 0;

    function initDuckHunt() {
        const area = document.getElementById('duckArea');
        area.innerHTML = '';
        let duck = document.createElement('div');
        duck.className = 'duck';
        let x = Math.random() * 300, y = 280;
        duck.style.left = x + 'px'; duck.style.top = y + 'px';

        let timer = setInterval(() => {
            y -= 4; x += (Math.random()-0.5)*10;
            duck.style.top = y + 'px'; duck.style.left = x + 'px';
            if (y < -40) { clearInterval(timer); duck.remove(); }
        }, 30);

        duck.onclick = () => {
            duckScore += 50;
            document.getElementById('duckScore').textContent = duckScore;
            clearInterval(timer);
            duck.remove();
        };

        area.appendChild(duck);
    }

    initDuckHunt();

    </script>
</body>
</html>
