<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helix Jump Mini</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Helix Jump Mini</h1>

    <div class="stats">Score: <strong id="hxScore">0</strong></div>
    <canvas id="hxCanvas" width="280" height="380" style="background:#0f1419; border-radius:8px;"></canvas>
    <button class="btn" onclick="initHelix()">Recommencer</button>
    <p class="instructions">Flèches Gauche/Droite pour faire pivoter les plateformes et faire descendre la bille.</p>

    </div>
    <script>

    const canvas = document.getElementById('hxCanvas');
    const ctx = canvas.getContext('2d');
    let ball = { y: 100, vy: 0 };
    let platforms = [{ y: 200, gap: 0 }, { y: 300, gap: 2 }];
    let rot = 0, hxScore = 0;

    function initHelix() {
        ball = { y: 100, vy: 0 };
        rot = 0; hxScore = 0;
        document.getElementById('hxScore').textContent = hxScore;
    }

    function updateHelix() {
        ball.vy += 0.2; // gravity
        ball.y += ball.vy;

        platforms.forEach(p => {
            if (ball.y >= p.y - 10 && ball.y <= p.y && ball.vy > 0) {
                ball.vy = -6; // bounce
                hxScore += 5;
                document.getElementById('hxScore').textContent = hxScore;
            }
        });

        if (ball.y > 380) initHelix();

        ctx.clearRect(0, 0, 280, 380);

        // Tower center
        ctx.fillStyle = '#273340';
        ctx.fillRect(130, 0, 20, 380);

        // Platforms
        ctx.fillStyle = '#1d9bf0';
        platforms.forEach(p => ctx.fillRect(40, p.y, 200, 10));

        // Ball
        ctx.fillStyle = '#f75c7e';
        ctx.beginPath(); ctx.arc(140, ball.y, 10, 0, Math.PI*2); ctx.fill();

        requestAnimationFrame(updateHelix);
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') rot -= 0.2;
        if (e.key === 'ArrowRight') rot += 0.2;
    });

    updateHelix();

    </script>
</body>
</html>
