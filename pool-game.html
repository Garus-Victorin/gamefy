<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billard 8-Pool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Billard 8-Pool</h1>

    <div class="stats">Billes rentrées: <strong id="poolScore">0</strong></div>
    <canvas id="poolCanvas" width="380" height="220" style="background:#00ba7c; border:8px solid #8b5a2b; border-radius:12px;"></canvas>
    <button class="btn" onclick="initPool()">Réinitialiser</button>
    <p class="instructions">Maintenez et glissez la souris depuis la bille blanche pour ajuster le tir.</p>

    </div>
    <script>

    const canvas = document.getElementById('poolCanvas');
    const ctx = canvas.getContext('2d');
    let whiteBall = { x: 100, y: 110, vx: 0, vy: 0, r: 8 };
    let redBall = { x: 280, y: 110, vx: 0, vy: 0, r: 8 };
    let poolScore = 0;

    function initPool() {
        whiteBall = { x: 100, y: 110, vx: 0, vy: 0, r: 8 };
        redBall = { x: 280, y: 110, vx: 0, vy: 0, r: 8 };
        poolScore = 0;
        document.getElementById('poolScore').textContent = poolScore;
    }

    function updatePool() {
        [whiteBall, redBall].forEach(b => {
            b.x += b.vx; b.y += b.vy;
            b.vx *= 0.98; b.vy *= 0.98; // friction

            if (b.x - b.r < 0 || b.x + b.r > 380) b.vx *= -1;
            if (b.y - b.r < 0 || b.y + b.r > 220) b.vy *= -1;
        });

        // Collision check
        let dx = redBall.x - whiteBall.x, dy = redBall.y - whiteBall.y;
        let dist = Math.hypot(dx, dy);
        if (dist < whiteBall.r + redBall.r) {
            redBall.vx = (dx / dist) * 4;
            redBall.vy = (dy / dist) * 4;
        }

        ctx.clearRect(0, 0, 380, 220);

        // White ball
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(whiteBall.x, whiteBall.y, whiteBall.r, 0, Math.PI*2); ctx.fill();

        // Red ball
        ctx.fillStyle = '#f75c7e';
        ctx.beginPath(); ctx.arc(redBall.x, redBall.y, redBall.r, 0, Math.PI*2); ctx.fill();

        requestAnimationFrame(updatePool);
    }

    canvas.addEventListener('click', (e) => {
        let rect = canvas.getBoundingClientRect();
        let dx = e.clientX - rect.left - whiteBall.x;
        let dy = e.clientY - rect.top - whiteBall.y;
        let dist = Math.hypot(dx, dy);
        whiteBall.vx = (dx / dist) * 6;
        whiteBall.vy = (dy / dist) * 6;
    });

    initPool();
    updatePool();

    </script>
</body>
</html>
