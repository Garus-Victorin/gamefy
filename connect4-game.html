<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puissance 4</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    .c4cell { width: 50px; height: 50px; border-radius: 50%; background: #0f1419; cursor: pointer; }
    .c4cell.red { background: #f75c7e; }
    .c4cell.yellow { background: #ffd166; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Puissance 4</h1>

    <div class="stats">
        <span>Tour: <strong id="pTurn" style="color:#f75c7e;">Rouge</strong></span>
    </div>
    <div id="c4board" style="display: grid; grid-template-columns: repeat(7, 50px); gap: 8px; background: #1e2732; padding: 10px; border-radius: 10px;"></div>
    <div id="c4msg" style="margin-top: 10px; font-size: 1.2rem; height: 30px; color: #00ba7c;"></div>
    <button class="btn" onclick="initC4()">Nouvelle partie</button>
    <p class="instructions">Cliquez sur une colonne pour lâcher un jeton. Alignez-en 4 !</p>

    </div>
    <script>

    const ROWS = 6, COLS = 7;
    let grid = [];
    let turn = 'red';
    let c4Active = true;

    function initC4() {
        grid = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
        turn = 'red';
        c4Active = true;
        document.getElementById('pTurn').textContent = 'Rouge';
        document.getElementById('pTurn').style.color = '#f75c7e';
        document.getElementById('c4msg').textContent = '';
        renderC4();
    }

    function renderC4() {
        const board = document.getElementById('c4board');
        board.innerHTML = '';
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement('div');
                cell.className = 'c4cell ' + (grid[r][c] || '');
                cell.onclick = () => dropToken(c);
                board.appendChild(cell);
            }
        }
    }

    function dropToken(col) {
        if (!c4Active) return;
        for (let r = ROWS - 1; r >= 0; r--) {
            if (!grid[r][col]) {
                grid[r][col] = turn;
                if (checkC4Win(r, col)) {
                    document.getElementById('c4msg').textContent = `Victoire des ${turn === 'red' ? 'Rouges' : 'Jaunes'} !`;
                    c4Active = false;
                } else {
                    turn = turn === 'red' ? 'yellow' : 'red';
                    const el = document.getElementById('pTurn');
                    el.textContent = turn === 'red' ? 'Rouge' : 'Jaune';
                    el.style.color = turn === 'red' ? '#f75c7e' : '#ffd166';
                }
                renderC4();
                return;
            }
        }
    }

    function checkC4Win(r, c) {
        const color = grid[r][c];
        const dirs = [[0,1],[1,0],[1,1],[1,-1]];
        for (let [dr, dc] of dirs) {
            let count = 1;
            for (let i = 1; i < 4; i++) {
                let nr = r + dr * i, nc = c + dc * i;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === color) count++;
                else break;
            }
            for (let i = 1; i < 4; i++) {
                let nr = r - dr * i, nc = c - dc * i;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === color) count++;
                else break;
            }
            if (count >= 4) return true;
        }
        return false;
    }

    initC4();

    </script>
</body>
</html>
