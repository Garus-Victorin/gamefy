<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match 3</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    .m3-cell { width:45px; height:45px; border-radius:6px; cursor:pointer; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Match 3</h1>

    <div class="stats">Score: <strong id="m3Score">0</strong></div>
    <div id="m3Board" style="display:grid; grid-template-columns:repeat(6, 45px); gap:4px; background:#1e2732; padding:6px; border-radius:8px;"></div>
    <button class="btn" onclick="initMatch3()">Réinitialiser</button>
    <p class="instructions">Cliquez sur deux gemmes adjacentes pour les échanger et aligner 3 gemmes de même couleur.</p>

    </div>
    <script>

    const m3Colors = ['#f75c7e', '#1d9bf0', '#00ba7c', '#ffd166', '#a855f7'];
    let m3Grid = Array(6).fill(0).map(() => Array(6).fill(0));
    let m3Sel = null, m3Score = 0;

    function initMatch3() {
        m3Score = 0;
        document.getElementById('m3Score').textContent = m3Score;
        for (let r=0; r<6; r++) for (let c=0; c<6; c++) m3Grid[r][c] = m3Colors[Math.floor(Math.random()*5)];
        renderM3();
    }

    function renderM3() {
        const board = document.getElementById('m3Board');
        board.innerHTML = '';
        for (let r=0; r<6; r++) {
            for (let c=0; c<6; c++) {
                let cell = document.createElement('div');
                cell.className = 'm3-cell';
                cell.style.background = m3Grid[r][c];
                if (m3Sel && m3Sel.r === r && m3Sel.c === c) cell.style.border = '3px solid #fff';
                cell.onclick = () => handleM3Click(r, c);
                board.appendChild(cell);
            }
        }
    }

    function handleM3Click(r, c) {
        if (!m3Sel) {
            m3Sel = { r, c };
            renderM3();
        } else {
            if (Math.abs(m3Sel.r - r) + Math.abs(m3Sel.c - c) === 1) {
                [m3Grid[m3Sel.r][m3Sel.c], m3Grid[r][c]] = [m3Grid[r][c], m3Grid[m3Sel.r][m3Sel.c]];
                m3Score += 30;
                document.getElementById('m3Score').textContent = m3Score;
            }
            m3Sel = null;
            renderM3();
        }
    }

    initMatch3();

    </script>
</body>
</html>
