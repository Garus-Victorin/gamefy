<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1419; min-height: 100vh; display: flex;
      justify-content: center; align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif; color: #e7e9ea;
    }
    .wrap {
      background: #16202a; border: 1px solid #2f3b47; border-radius: 12px;
      padding: 24px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    h1 { color: #ffd32a; font-size: 22px; margin-bottom: 14px; }
    canvas { background: #70c5ce; border: 2px solid #2f3b47; border-radius: 8px; display: block; margin: 0 auto; }
    .hud { margin-top: 12px; font-size: 16px; }
    .hud strong { color: #39ff14; }
    .msg { min-height: 22px; margin-top: 8px; color: #8ab4f8; font-size: 14px; }
    button {
      margin-top: 12px; background: #39ff14; color: #0a0e12; border: none;
      padding: 10px 28px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px;
    }
    .ctrl { margin-top: 12px; color: #6b7a88; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🐦 FLAPPY BIRD</h1>
    <canvas id="c" width="360" height="520"></canvas>
    <div class="hud">Score : <strong id="sc">0</strong> · Record : <strong id="hs">0</strong></div>
    <div class="msg" id="msg">Espace / clic pour voler</div>
    <button id="btn">Rejouer</button>
    <div class="ctrl">Espace ou clic pour sauter</div>
  </div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const scEl = document.getElementById('sc');
    const hsEl = document.getElementById('hs');
    const msg = document.getElementById('msg');

    let bird, pipes, score, high, running, grav, frame;

    high = Number(localStorage.getItem('flappyHS') || 0);
    hsEl.textContent = high;

    function reset() {
      bird = { x: 80, y: H/2, r: 14, vy: 0 };
      pipes = [];
      score = 0; frame = 0;
      grav = 0.35;
      scEl.textContent = '0';
      running = false;
      msg.textContent = 'Espace / clic pour commencer';
      spawnPipe();
    }

    function spawnPipe() {
      const gap = 130;
      const top = 60 + Math.random() * (H - 200 - gap);
      pipes.push({ x: W + 20, w: 52, top, gap, scored: false });
    }

    function flap() {
      if (!running) { running = true; msg.textContent = ''; }
      if (!running && msg.textContent.includes('Game')) return;
      bird.vy = -6.5;
    }

    function startOrFlap() {
      if (msg.textContent.includes('Game Over')) return;
      if (!running) { running = true; msg.textContent = ''; }
      bird.vy = -6.5;
    }

    function update() {
      if (!running) return;
      frame++;
      bird.vy += grav;
      bird.y += bird.vy;

      if (frame % 90 === 0) spawnPipe();

      for (const p of pipes) {
        p.x -= 2.4;
        if (!p.scored && p.x + p.w < bird.x) {
          p.scored = true;
          score++; scEl.textContent = score;
          if (score > high) {
            high = score; hsEl.textContent = high;
            localStorage.setItem('flappyHS', String(high));
          }
        }
        const inX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + p.w;
        const hitTop = bird.y - bird.r < p.top;
        const hitBot = bird.y + bird.r > p.top + p.gap;
        if (inX && (hitTop || hitBot)) end();
      }
      pipes = pipes.filter(p => p.x + p.w > -10);

      if (bird.y + bird.r > H - 40 || bird.y - bird.r < 0) end();
    }

    function end() {
      running = false;
      msg.textContent = 'Game Over — Score : ' + score;
    }

    function draw() {
      // ciel
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#4ec0ca'); g.addColorStop(1, '#70c5ce');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

      // nuages
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      for (let i = 0; i < 3; i++) {
        const cx = ((frame * 0.3 + i * 140) % (W + 80)) - 40;
        ctx.beginPath(); ctx.arc(cx, 60 + i * 30, 22, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 18, 60 + i * 30, 16, 0, Math.PI*2); ctx.fill();
      }

      // tuyaux
      for (const p of pipes) {
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(p.x, 0, p.w, p.top);
        ctx.fillRect(p.x, p.top + p.gap, p.w, H - (p.top + p.gap) - 40);
        ctx.fillStyle = '#27ae60';
        ctx.fillRect(p.x - 3, p.top - 18, p.w + 6, 18);
        ctx.fillRect(p.x - 3, p.top + p.gap, p.w + 6, 18);
      }

      // sol
      ctx.fillStyle = '#ded895';
      ctx.fillRect(0, H - 40, W, 40);
      ctx.fillStyle = '#5c8a3c';
      ctx.fillRect(0, H - 40, W, 8);

      // oiseau
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(Math.min(Math.PI/4, Math.max(-Math.PI/6, bird.vy * 0.06)));
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath(); ctx.ellipse(0, 0, bird.r, bird.r * 0.85, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(6, -4, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(8, -4, 2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#e67e22';
      ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(20, 3); ctx.lineTo(10, 6); ctx.fill();
      ctx.restore();

      // score en jeu
      if (running) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText(score, W/2, 50);
      }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    document.addEventListener('keydown', e => {
      if (e.key === ' ') { e.preventDefault(); startOrFlap(); }
    });
    canvas.addEventListener('mousedown', startOrFlap);
    document.getElementById('btn').onclick = reset;
    reset(); loop();
  </script>
</body>
</html>
