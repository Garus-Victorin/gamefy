<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plinko Mini</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Plinko Mini</h1>

    <div class="stats">Gain: <strong id="plinkoScore">0</strong> pts</div>
    <canvas id="plkCanvas" width="320" height="360" style="background:#161e27; border-radius:8px;"></canvas>
    <button class="btn" onclick="dropPlinkoBall()">Lâcher une Bille</button>
    <p class="instructions">Lâchez une bille du haut du plateau pour cumuler des points selon les réceptacles du bas.</p>

    </div>
    <script>

    const canvas = document.getElementById('plkCanvas');
    const ctx = canvas.getContext('2d');
    let pBall = { x: 160, y: 20, vx: 0, vy: 0, active: false };
    let plinkoScore = 0;

    function dropPlinkoBall() {
        if (!pBall.active) {
            pBall = { x: 160 + (Math.random()-0.5)*20, y: 20, vx: (Math.random()-0.5)*2, vy: 1, active: true };
        }
    }

    function updatePlinko() {
        if (pBall.active) {
            pBall.vy += 0.15;
            pBall.x += pBall.vx; pBall.y += pBall.vy;

            // Bounce on pegs
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 6; c++) {
                    let px = 60 + c * 40 + (r % 2 === 1 ? 20 : 0);
                    let py = 80 + r * 45;
                    if (Math.hypot(pBall.x - px, pBall.y - py) < 12) {
                        pBall.vx = (pBall.x - px) * 0.4;
                        pBall.vy *= -0.5;
                    }
                }
            }

            if (pBall.y > 330) {
                pBall.active = false;
                plinkoScore += 100;
                document.getElementById('plinkoScore').textContent = plinkoScore;
            }
        }

        ctx.clearRect(0, 0, 320, 360);

        // Draw Pegs
        ctx.fillStyle = '#e7e9ea';
        for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 6; c++) {
                let px = 60 + c * 40 + (r % 2 === 1 ? 20 : 0);
                let py = 80 + r * 45;
                ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI*2); ctx.fill();
            }
        }

        // Draw Ball
        if (pBall.active) {
            ctx.fillStyle = '#f75c7e';
            ctx.beginPath(); ctx.arc(pBall.x, pBall.y, 8, 0, Math.PI*2); ctx.fill();
        }

        requestAnimationFrame(updatePlinko);
    }

    updatePlinko();

    </script>
</body>
</html>
