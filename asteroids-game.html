<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asteroids</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1419; min-height: 100vh; display: flex;
      justify-content: center; align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif; color: #e7e9ea;
    }
    .wrap {
      background: #16202a; border: 1px solid #2f3b47; border-radius: 12px;
      padding: 24px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    h1 { color: #39ff14; font-size: 22px; margin-bottom: 14px; }
    canvas { background: #05080c; border: 2px solid #2f3b47; border-radius: 8px; display: block; margin: 0 auto; }
    .hud { margin-top: 12px; font-size: 16px; }
    .hud strong { color: #39ff14; }
    .msg { min-height: 22px; margin-top: 8px; color: #8ab4f8; font-size: 14px; }
    button {
      margin-top: 12px; background: #39ff14; color: #0a0e12; border: none;
      padding: 10px 28px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px;
    }
    .ctrl { margin-top: 12px; color: #6b7a88; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>☄️ ASTEROIDS</h1>
    <canvas id="c" width="560" height="480"></canvas>
    <div class="hud">Score : <strong id="sc">0</strong> · Vies : <strong id="lv">3</strong></div>
    <div class="msg" id="msg">Espace pour démarrer</div>
    <button id="btn">Rejouer</button>
    <div class="ctrl">← → tourner · ↑ avancer · Espace tirer</div>
  </div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const scEl = document.getElementById('sc');
    const lvEl = document.getElementById('lv');
    const msg = document.getElementById('msg');

    let ship, bullets, rocks, score, lives, running, keys = {}, invuln, cooldown;

    function makeRock(x, y, r, level = 3) {
      const pts = 8 + Math.floor(Math.random() * 4);
      const shape = [];
      for (let i = 0; i < pts; i++) {
        const a = (i / pts) * Math.PI * 2;
        const d = r * (0.7 + Math.random() * 0.3);
        shape.push({ a, d });
      }
      return {
        x: x ?? Math.random() * W,
        y: y ?? Math.random() * H,
        r, level, shape,
        vx: (Math.random() - 0.5) * (4 - level + 1) * 1.5,
        vy: (Math.random() - 0.5) * (4 - level + 1) * 1.5,
      };
    }

    function spawnWave(n = 4) {
      rocks = [];
      for (let i = 0; i < n; i++) {
        let x, y;
        do {
          x = Math.random() * W; y = Math.random() * H;
        } while (Math.hypot(x - ship.x, y - ship.y) < 120);
        rocks.push(makeRock(x, y, 40, 3));
      }
    }

    function resetShip() {
      ship = { x: W/2, y: H/2, a: -Math.PI/2, vx: 0, vy: 0, r: 12 };
      invuln = 120;
    }

    function reset() {
      resetShip();
      bullets = [];
      score = 0; lives = 3; cooldown = 0;
      scEl.textContent = '0'; lvEl.textContent = '3';
      spawnWave(4);
      running = false;
      msg.textContent = 'Espace pour démarrer';
    }

    function wrap(o) {
      if (o.x < -o.r) o.x = W + o.r;
      if (o.x > W + o.r) o.x = -o.r;
      if (o.y < -o.r) o.y = H + o.r;
      if (o.y > H + o.r) o.y = -o.r;
    }

    function update() {
      if (!running) return;
      if (cooldown > 0) cooldown--;
      if (invuln > 0) invuln--;

      if (keys['arrowleft'] || keys['q']) ship.a -= 0.08;
      if (keys['arrowright'] || keys['d']) ship.a += 0.08;
      if (keys['arrowup'] || keys['z'] || keys['w']) {
        ship.vx += Math.cos(ship.a) * 0.18;
        ship.vy += Math.sin(ship.a) * 0.18;
      }
      ship.vx *= 0.99; ship.vy *= 0.99;
      const sp = Math.hypot(ship.vx, ship.vy);
      if (sp > 6) { ship.vx = ship.vx / sp * 6; ship.vy = ship.vy / sp * 6; }
      ship.x += ship.vx; ship.y += ship.vy;
      wrap(ship);

      for (const b of bullets) { b.x += b.vx; b.y += b.vy; b.life--; }
      bullets = bullets.filter(b => b.life > 0 && b.x > -20 && b.x < W+20 && b.y > -20 && b.y < H+20);

      for (const r of rocks) { r.x += r.vx; r.y += r.vy; wrap(r); }

      // bullet vs rock
      for (const b of bullets) {
        for (let i = rocks.length - 1; i >= 0; i--) {
          const r = rocks[i];
          if (Math.hypot(b.x - r.x, b.y - r.y) < r.r) {
            b.life = 0;
            score += (4 - r.level) * 20;
            scEl.textContent = score;
            rocks.splice(i, 1);
            if (r.level > 1) {
              const nr = r.r * 0.55;
              rocks.push(makeRock(r.x, r.y, nr, r.level - 1));
              rocks.push(makeRock(r.x, r.y, nr, r.level - 1));
            }
            break;
          }
        }
      }

      // ship vs rock
      if (invuln <= 0) {
        for (const r of rocks) {
          if (Math.hypot(ship.x - r.x, ship.y - r.y) < r.r + ship.r) {
            lives--; lvEl.textContent = lives;
            if (lives <= 0) {
              running = false;
              msg.textContent = 'Game Over — Score : ' + score;
            } else {
              resetShip();
            }
            break;
          }
        }
      }

      if (rocks.length === 0) {
        spawnWave(Math.min(8, 4 + Math.floor(score / 500)));
        msg.textContent = 'Vague suivante !';
        setTimeout(() => { if (running) msg.textContent = ''; }, 1000);
      }
    }

    function shoot() {
      if (!running) {
        if (msg.textContent.includes('Game Over')) return;
        running = true; msg.textContent = '';
      }
      if (cooldown > 0) return;
      bullets.push({
        x: ship.x + Math.cos(ship.a) * 14,
        y: ship.y + Math.sin(ship.a) * 14,
        vx: Math.cos(ship.a) * 9 + ship.vx * 0.3,
        vy: Math.sin(ship.a) * 9 + ship.vy * 0.3,
        life: 40,
      });
      cooldown = 10;
    }

    function draw() {
      ctx.fillStyle = '#05080c';
      ctx.fillRect(0, 0, W, H);

      // rocks
      ctx.strokeStyle = '#c8d0d8';
      ctx.lineWidth = 1.5;
      for (const r of rocks) {
        ctx.beginPath();
        r.shape.forEach((p, i) => {
          const x = r.x + Math.cos(p.a) * p.d;
          const y = r.y + Math.sin(p.a) * p.d;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.closePath(); ctx.stroke();
      }

      // bullets
      ctx.fillStyle = '#39ff14';
      for (const b of bullets) {
        ctx.beginPath(); ctx.arc(b.x, b.y, 2.5, 0, Math.PI*2); ctx.fill();
      }

      // ship
      if (invuln <= 0 || Math.floor(invuln / 4) % 2 === 0) {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.a);
        ctx.strokeStyle = '#39ff14';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(14, 0); ctx.lineTo(-10, 9); ctx.lineTo(-6, 0); ctx.lineTo(-10, -9);
        ctx.closePath(); ctx.stroke();
        if (keys['arrowup'] || keys['z'] || keys['w']) {
          ctx.strokeStyle = '#ff6b6b';
          ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-14, 0); ctx.stroke();
        }
        ctx.restore();
      }
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    document.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === ' ') { e.preventDefault(); shoot(); }
    });
    document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    document.getElementById('btn').onclick = reset;
    reset(); loop();
  </script>
</body>
</html>
