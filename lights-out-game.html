<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lights Out</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    .lo-cell { width:60px; height:60px; border-radius:8px; background:#1e2732; cursor:pointer; transition:background 0.2s; }
    .lo-cell.on { background:#ffd166; box-shadow:0 0 12px #ffd166; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Lights Out</h1>

    <div class="stats">
        <span>Coup(s): <strong id="loMoves">0</strong></span>
    </div>
    <div id="loBoard" style="display:grid; grid-template-columns:repeat(5, 60px); gap:8px;"></div>
    <div id="loMsg" style="height:25px; margin-top:10px; color:#00ba7c; font-size:1.1rem;"></div>
    <button class="btn" onclick="initLightsOut()">Réinitialiser</button>
    <p class="instructions">Eteignez toutes les lumières ! Cliquer sur une case inverse son état et celui de ses voisines.</p>

    </div>
    <script>

    let loGrid = Array(5).fill(false).map(() => Array(5).fill(false));
    let loMoves = 0;

    function initLightsOut() {
        loMoves = 0;
        document.getElementById('loMoves').textContent = loMoves;
        document.getElementById('loMsg').textContent = '';
        loGrid = Array(5).fill(false).map(() => Array(5).fill(false));
        // Randomize initial state
        for(let i=0; i<8; i++) toggleLO(Math.floor(Math.random()*5), Math.floor(Math.random()*5), false);
        renderLO();
    }

    function toggleLO(r, c, countMove = true) {
        const dirs = [[0,0],[0,1],[0,-1],[1,0],[-1,0]];
        dirs.forEach(([dr, dc]) => {
            let nr = r + dr, nc = c + dc;
            if (nr>=0 && nr<5 && nc>=0 && nc<5) loGrid[nr][nc] = !loGrid[nr][nc];
        });
        if (countMove) {
            loMoves++;
            document.getElementById('loMoves').textContent = loMoves;
        }
    }

    function handleLOClick(r, c) {
        toggleLO(r, c);
        renderLO();
        if (loGrid.every(row => row.every(v => !v))) {
            document.getElementById('loMsg').textContent = 'Victoire ! Toutes les lumières sont éteintes !';
        }
    }

    function renderLO() {
        const board = document.getElementById('loBoard');
        board.innerHTML = '';
        for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 5; c++) {
                let cell = document.createElement('div');
                cell.className = 'lo-cell' + (loGrid[r][c] ? ' on' : '');
                cell.onclick = () => handleLOClick(r, c);
                board.appendChild(cell);
            }
        }
    }

    initLightsOut();

    </script>
</body>
</html>
