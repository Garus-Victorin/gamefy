<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temps de Réaction</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Temps de Réaction</h1>

    <div id="reactBox" onclick="handleReactClick()" style="width:320px; height:220px; background:#f75c7e; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:bold; cursor:pointer; color:#fff; user-select:none; margin:20px 0;">Cliquez pour commencer</div>
    <div class="stats">Temps: <strong id="reactTime">--</strong> ms</div>
    <button class="btn" onclick="startReactTest()">Recommencer</button>
    <p class="instructions">Cliquez dès que le rectangle rouge devient vert !</p>

    </div>
    <script>

    let reactState = 'idle', startTime = 0, reactTimer = null;

    function startReactTest() {
        const box = document.getElementById('reactBox');
        box.style.background = '#f75c7e';
        box.textContent = 'Attendez le vert...';
        reactState = 'waiting';
        clearTimeout(reactTimer);
        reactTimer = setTimeout(() => {
            box.style.background = '#00ba7c';
            box.textContent = 'CLIQUEZ !';
            startTime = Date.now();
            reactState = 'ready';
        }, 2000 + Math.random()*3000);
    }

    function handleReactClick() {
        const box = document.getElementById('reactBox');
        if (reactState === 'idle') {
            startReactTest();
        } else if (reactState === 'waiting') {
            clearTimeout(reactTimer);
            box.textContent = 'Trop tôt ! Recommencez.';
            reactState = 'idle';
        } else if (reactState === 'ready') {
            let time = Date.now() - startTime;
            document.getElementById('reactTime').textContent = time;
            box.textContent = `${time} ms ! Clic pour rejouer.`;
            reactState = 'idle';
        }
    }

    </script>
</body>
</html>
