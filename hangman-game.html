<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu du Pendu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    .key-btn {
        width: 35px; height: 40px; background: #1e2732; color: #fff; border: none;
        border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
    }
    .key-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Jeu du Pendu</h1>

    <div class="stats">
        <span>Erreurs: <strong id="hErrors">0</strong>/6</span>
    </div>
    <div style="font-size: 2rem; letter-spacing: 10px; margin: 20px 0; font-weight: bold; color: #1d9bf0;" id="wordDisplay">_ _ _ _</div>
    <div id="keyboard" style="display: flex; flex-wrap: wrap; gap: 6px; max-width: 400px; justify-content: center;"></div>
    <div id="hMsg" style="margin-top: 15px; font-size: 1.2rem; height: 30px; color: #00ba7c;"></div>
    <button class="btn" onclick="initHangman()">Mot Suivant</button>
    <p class="instructions">Devinez le mot secret lettre par lettre avant d'épuiser vos 6 essais.</p>

    </div>
    <script>

    const words = ["DEVELOPPEUR", "JAVASCRIPT", "NAVIGATEUR", "ORDINATEUR", "PROGRAMMATION", "ALGORITHME", "LUMIERE", "AVENTURE"];
    let selectedWord = "", guessedLetters = new Set(), errors = 0;

    function initHangman() {
        selectedWord = words[Math.floor(Math.random() * words.length)];
        guessedLetters.clear();
        errors = 0;
        document.getElementById('hErrors').textContent = errors;
        document.getElementById('hMsg').textContent = '';
        renderWord();
        renderKeyboard();
    }

    function renderWord() {
        let display = selectedWord.split('').map(l => guessedLetters.has(l) ? l : '_').join(' ');
        document.getElementById('wordDisplay').textContent = display;
        if (!display.includes('_')) {
            document.getElementById('hMsg').textContent = 'Bravo ! Vous avez gagné !';
            disableKeyboard();
        }
    }

    function renderKeyboard() {
        const kb = document.getElementById('keyboard');
        kb.innerHTML = '';
        for (let i = 65; i <= 90; i++) {
            let char = String.fromCharCode(i);
            let btn = document.createElement('button');
            btn.className = 'key-btn';
            btn.textContent = char;
            btn.disabled = guessedLetters.has(char);
            btn.onclick = () => guessLetter(char, btn);
            kb.appendChild(btn);
        }
    }

    function guessLetter(char, btn) {
        guessedLetters.add(char);
        btn.disabled = true;
        if (!selectedWord.includes(char)) {
            errors++;
            document.getElementById('hErrors').textContent = errors;
            if (errors >= 6) {
                document.getElementById('hMsg').textContent = 'Perdu ! Le mot était : ' + selectedWord;
                document.getElementById('wordDisplay').textContent = selectedWord.split('').join(' ');
                disableKeyboard();
            }
        } else {
            renderWord();
        }
    }

    function disableKeyboard() {
        document.querySelectorAll('.key-btn').forEach(b => b.disabled = true);
    }

    initHangman();

    </script>
</body>
</html>
