<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Math</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Speed Math</h1>

    <div class="stats">Score: <strong id="mathScore">0</strong></div>
    <div id="mathEquation" style="font-size:2.5rem; font-weight:bold; color:#ffd166; margin:20px 0;">7 + 5 = 12</div>
    <div style="display:flex; gap:15px;">
        <button class="btn" style="background:#00ba7c;" onclick="answerMath(true)">VRAI</button>
        <button class="btn" style="background:#f75c7e;" onclick="answerMath(false)">FAUX</button>
    </div>
    <p class="instructions">Indiquez si l'équation proposée est exacte ou fausse avant la fin du temps.</p>

    </div>
    <script>

    let mathScore = 0, isCorrect = true;

    function initMath() {
        let a = Math.floor(Math.random()*15) + 1;
        let b = Math.floor(Math.random()*15) + 1;
        isCorrect = Math.random() > 0.5;
        let displayedResult = isCorrect ? (a + b) : (a + b + Math.floor(Math.random()*5) + 1);
        document.getElementById('mathEquation').textContent = `${a} + ${b} = ${displayedResult}`;
    }

    function answerMath(userAns) {
        if (userAns === isCorrect) {
            mathScore += 10;
            document.getElementById('mathScore').textContent = mathScore;
            initMath();
        } else {
            mathScore = 0;
            document.getElementById('mathScore').textContent = mathScore;
            initMath();
        }
    }

    initMath();

    </script>
</body>
</html>
