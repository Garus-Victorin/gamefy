<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexagon Runner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Hexagon Runner</h1>

    <div class="stats">Temps: <strong id="hexTime">0</strong>s</div>
    <canvas id="hexCanvas" width="350" height="350" style="background:#0f1419; border-radius:8px;"></canvas>
    <button class="btn" onclick="initHex()">Recommencer</button>
    <p class="instructions">Flèches Gauche/Droite pour tourner autour du centre et esquiver les murs hexagonaux.</p>

    </div>
    <script>

    const canvas = document.getElementById('hexCanvas');
    const ctx = canvas.getContext('2d');
    let angle = 0, hexRadius = 150, hexTime = 0, hexActive = true;

    function initHex() {
        angle = 0; hexRadius = 150; hexTime = 0; hexActive = true;
    }

    function updateHex() {
        if (hexActive) {
            hexRadius -= 1.5;
            if (hexRadius < 20) hexRadius = 150;
            hexTime += 0.016;
            document.getElementById('hexTime').textContent = hexTime.toFixed(1);
        }

        ctx.clearRect(0, 0, 350, 350);

        // Center
        ctx.fillStyle = '#1d9bf0';
        ctx.beginPath(); ctx.arc(175, 175, 15, 0, Math.PI*2); ctx.fill();

        // Shrinking hexagon
        ctx.strokeStyle = '#f75c7e';
        ctx.lineWidth = 4;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            let a = i * Math.PI / 3;
            let x = 175 + hexRadius * Math.cos(a);
            let y = 175 + hexRadius * Math.sin(a);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();

        // Player
        let px = 175 + 30 * Math.cos(angle);
        let py = 175 + 30 * Math.sin(angle);
        ctx.fillStyle = '#00ba7c';
        ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI*2); ctx.fill();

        requestAnimationFrame(updateHex);
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') angle -= 0.3;
        if (e.key === 'ArrowRight') angle += 0.3;
    });

    updateHex();

    </script>
</body>
</html>
