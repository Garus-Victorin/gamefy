<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Switch Mini</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Color Switch Mini</h1>

    <div class="stats">Score: <strong id="csScore">0</strong></div>
    <canvas id="csCanvas" width="300" height="400" style="background:#0f1419; border-radius:8px;"></canvas>
    <button class="btn" onclick="initColorSwitch()">Sauter (ESPACE)</button>
    <p class="instructions">Passez l'obstacle uniquement par la zone de même couleur que votre bille.</p>

    </div>
    <script>

    const canvas = document.getElementById('csCanvas');
    const ctx = canvas.getContext('2d');
    let csBall = { y: 300, vy: 0, color: '#1d9bf0' };
    let csColors = ['#1d9bf0', '#f75c7e', '#ffd166', '#00ba7c'];
    let rot = 0, csScore = 0;

    function initColorSwitch() {
        csBall = { y: 300, vy: 0, color: csColors[Math.floor(Math.random()*4)] };
        csScore = 0;
        document.getElementById('csScore').textContent = csScore;
    }

    function updateCS() {
        csBall.vy += 0.2; // gravity
        csBall.y += csBall.vy;
        if (csBall.y > 380) csBall.y = 380;

        rot += 0.03;

        ctx.clearRect(0, 0, 300, 400);

        // Rotating ring
        ctx.save();
        ctx.translate(150, 180);
        ctx.rotate(rot);
        for(let i=0; i<4; i++) {
            ctx.strokeStyle = csColors[i];
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.arc(0, 0, 60, i*Math.PI/2, (i+1)*Math.PI/2);
            ctx.stroke();
        }
        ctx.restore();

        // Ball
        ctx.fillStyle = csBall.color;
        ctx.beginPath(); ctx.arc(150, csBall.y, 10, 0, Math.PI*2); ctx.fill();

        requestAnimationFrame(updateCS);
    }

    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') csBall.vy = -5;
    });

    initColorSwitch();
    updateCS();

    </script>
</body>
</html>
