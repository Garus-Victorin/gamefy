<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Beat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Rhythm Beat</h1>

    <div class="stats">Combo: <strong id="beatScore">0</strong></div>
    <canvas id="beatCanvas" width="300" height="380" style="background:#0f1419; border-radius:8px;"></canvas>
    <button class="btn" onclick="initRhythm()">Démarrer</button>
    <p class="instructions">Appuyez sur D, F, J, K lorsque les notes violettes atteignent la ligne du bas.</p>

    </div>
    <script>

    const canvas = document.getElementById('beatCanvas');
    const ctx = canvas.getContext('2d');
    let notes = [];
    let beatScore = 0;

    function initRhythm() {
        notes = []; beatScore = 0;
        document.getElementById('beatScore').textContent = beatScore;
    }

    function updateRhythm() {
        if (Math.random() < 0.05) {
            let col = Math.floor(Math.random()*4);
            notes.push({ col: col, y: 0 });
        }

        ctx.clearRect(0, 0, 300, 380);

        // Target line
        ctx.strokeStyle = '#00ba7c'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0, 320); ctx.lineTo(300, 320); ctx.stroke();

        // Columns
        for (let i = 0; i < 4; i++) {
            ctx.strokeStyle = '#273340'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(i*75, 0); ctx.lineTo(i*75, 380); ctx.stroke();
        }

        // Notes
        ctx.fillStyle = '#a855f7';
        for (let i = notes.length - 1; i >= 0; i--) {
            let n = notes[i];
            n.y += 4;
            ctx.fillRect(n.col * 75 + 10, n.y, 55, 20);
            if (n.y > 380) notes.splice(i, 1);
        }

        requestAnimationFrame(updateRhythm);
    }

    document.addEventListener('keydown', (e) => {
        const keys = ['d', 'f', 'j', 'k'];
        let idx = keys.indexOf(e.key.toLowerCase());
        if (idx !== -1) {
            for (let i = notes.length - 1; i >= 0; i--) {
                if (notes[i].col === idx && Math.abs(notes[i].y - 310) < 30) {
                    beatScore++;
                    document.getElementById('beatScore').textContent = beatScore;
                    notes.splice(i, 1);
                    break;
                }
            }
        }
    });

    updateRhythm();

    </script>
</body>
</html>
