<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpion</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    .cell {
        width: 100px; height: 100px; background: #1e2732; border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-size: 2.5rem; font-weight: bold; cursor: pointer; color: #1d9bf0;
    }
    .cell:hover { background: #273340; }
    .cell.o { color: #f75c7e; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Morpion</h1>

    <div class="stats">
        <span>Joueur: <strong id="turn">X</strong></span>
        <span>Score X: <strong id="scoreX">0</strong> | O: <strong id="scoreO">0</strong></span>
    </div>
    <div id="board" style="display: grid; grid-template-columns: repeat(3, 100px); gap: 10px;"></div>
    <div id="msg" style="margin-top: 10px; font-size: 1.2rem; color: #00ba7c; height: 30px;"></div>
    <button class="btn" onclick="resetBoard()">Recommencer</button>
    <p class="instructions">Alignez 3 symboles pour gagner (2 Joueurs / VS Ordinateur)</p>

    </div>
    <script>

    let board = ['', '', '', '', '', '', '', '', ''];
    let currentPlayer = 'X';
    let active = true;
    let scores = { X: 0, O: 0 };

    const boardEl = document.getElementById('board');
    const turnEl = document.getElementById('turn');
    const msgEl = document.getElementById('msg');

    function createBoard() {
        boardEl.innerHTML = '';
        board.forEach((val, idx) => {
            const cell = document.createElement('div');
            cell.className = 'cell ' + (val.toLowerCase());
            cell.textContent = val;
            cell.onclick = () => handleClick(idx);
            boardEl.appendChild(cell);
        });
    }

    function handleClick(idx) {
        if (board[idx] !== '' || !active) return;
        board[idx] = currentPlayer;
        createBoard();
        if (checkWin()) {
            msgEl.textContent = `Le joueur ${currentPlayer} a gagné !`;
            scores[currentPlayer]++;
            updateScores();
            active = false;
            return;
        }
        if (board.every(c => c !== '')) {
            msgEl.textContent = 'Match nul !';
            active = false;
            return;
        }
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        turnEl.textContent = currentPlayer;
    }

    function checkWin() {
        const wins = [
            [0,1,2],[3,4,5],[6,7,8],
            [0,3,6],[1,4,7],[2,5,8],
            [0,4,8],[2,4,6]
        ];
        return wins.some(w => w.every(idx => board[idx] === currentPlayer));
    }

    function updateScores() {
        document.getElementById('scoreX').textContent = scores.X;
        document.getElementById('scoreO').textContent = scores.O;
    }

    function resetBoard() {
        board = ['', '', '', '', '', '', '', '', ''];
        currentPlayer = 'X';
        active = true;
        turnEl.textContent = 'X';
        msgEl.textContent = '';
        createBoard();
    }

    createBoard();

    </script>
</body>
</html>
