<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu d'Échecs</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    .c-cell { width:45px; height:45px; display:flex; align-items:center; justify-content:center; font-size:1.8rem; cursor:pointer; }
    .c-cell.dark { background: #1e2732; }
    .c-cell.light { background: #273340; }
    .c-cell.selected { background: #1d9bf0 !important; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Jeu d'Échecs</h1>

    <div class="stats">
        <span>Tour: <strong id="chessTurn">Blancs</strong></span>
    </div>
    <div id="chessBoard" style="display:grid; grid-template-columns:repeat(8, 45px); border:2px solid #273340;"></div>
    <div id="chessMsg" style="height:25px; margin-top:10px; color:#00ba7c;"></div>
    <button class="btn" onclick="initChess()">Nouvelle partie</button>
    <p class="instructions">Sélectionnez une pièce puis sa case de destination.</p>

    </div>
    <script>

    let cBoard = [
        ['♜','♞','♝','♛','♚','♝','♞','♜'],
        ['♟','♟','♟','♟','♟','♟','♟','♟'],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['','','','','','','',''],
        ['♙','♙','♙','♙','♙','♙','♙','♙'],
        ['♖','♘','♗','♕','♔','♗','♘','♖']
    ];
    let cSelected = null, cTurn = 'white';

    function initChess() {
        cBoard = [
            ['♜','♞','♝','♛','♚','♝','♞','♜'],
            ['♟','♟','♟','♟','♟','♟','♟','♟'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['♙','♙','♙','♙','♙','♙','♙','♙'],
            ['♖','♘','♗','♕','♔','♗','♘','♖']
        ];
        cSelected = null; cTurn = 'white';
        renderChess();
    }

    function renderChess() {
        const boardEl = document.getElementById('chessBoard');
        boardEl.innerHTML = '';
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                let cell = document.createElement('div');
                cell.className = 'c-cell ' + ((r + c) % 2 === 1 ? 'dark' : 'light');
                if (cSelected && cSelected.r === r && cSelected.c === c) cell.classList.add('selected');
                cell.textContent = cBoard[r][c];
                cell.onclick = () => handleChessClick(r, c);
                boardEl.appendChild(cell);
            }
        }
    }

    function handleChessClick(r, c) {
        if (!cSelected && cBoard[r][c] !== '') {
            cSelected = { r, c };
            renderChess();
        } else if (cSelected) {
            cBoard[r][c] = cBoard[cSelected.r][cSelected.c];
            cBoard[cSelected.r][cSelected.c] = '';
            cSelected = null;
            cTurn = cTurn === 'white' ? 'black' : 'white';
            document.getElementById('chessTurn').textContent = cTurn === 'white' ? 'Blancs' : 'Noirs';
            renderChess();
        }
    }

    initChess();

    </script>
</body>
</html>
