<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breakout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1419; min-height: 100vh; display: flex;
      justify-content: center; align-items: center;
      font-family: 'Segoe UI', system-ui, sans-serif; color: #e7e9ea;
    }
    .wrap {
      background: #16202a; border: 1px solid #2f3b47; border-radius: 12px;
      padding: 24px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }
    h1 { color: #39ff14; font-size: 22px; margin-bottom: 14px; }
    canvas { background: #0a0e12; border: 2px solid #2f3b47; border-radius: 8px; display: block; margin: 0 auto; }
    .hud { display: flex; justify-content: space-between; margin-top: 12px; font-size: 16px; }
    .hud strong { color: #39ff14; }
    .msg { min-height: 22px; margin-top: 8px; color: #8ab4f8; font-size: 14px; }
    button {
      margin-top: 12px; background: #39ff14; color: #0a0e12; border: none;
      padding: 10px 28px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px;
    }
    .ctrl { margin-top: 12px; color: #6b7a88; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🧱 BREAKOUT</h1>
    <canvas id="c" width="480" height="520"></canvas>
    <div class="hud">
      <span>Score : <strong id="sc">0</strong></span>
      <span>Vies : <strong id="lv">3</strong></span>
    </div>
    <div class="msg" id="msg">Espace pour lancer</div>
    <button id="btn">Rejouer</button>
    <div class="ctrl">Souris ou flèches pour bouger la raquette</div>
  </div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const scEl = document.getElementById('sc');
    const lvEl = document.getElementById('lv');
    const msg = document.getElementById('msg');

    const COLORS = ['#ff6b6b','#ffa502','#ffd32a','#39ff14','#1e90ff','#a55eea'];
    let paddle, ball, bricks, score, lives, running, launched, keys = {};

    function makeBricks() {
      bricks = [];
      const rows = 6, cols = 10, bw = 42, bh = 16, gap = 4, ox = 18, oy = 50;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          bricks.push({ x: ox + c * (bw + gap), y: oy + r * (bh + gap), w: bw, h: bh, color: COLORS[r], alive: true });
        }
      }
    }

    function resetBall() {
      ball = { x: paddle.x + paddle.w / 2, y: paddle.y - 10, r: 7, dx: 0, dy: 0 };
      launched = false;
    }

    function reset() {
      paddle = { x: W/2 - 50, y: H - 30, w: 100, h: 12 };
      score = 0; lives = 3;
      scEl.textContent = '0'; lvEl.textContent = '3';
      makeBricks(); resetBall();
      running = true; msg.textContent = 'Espace pour lancer';
    }

    function launch() {
      if (launched || !running) return;
      launched = true;
      ball.dx = (Math.random() < 0.5 ? -1 : 1) * 4;
      ball.dy = -5;
      msg.textContent = '';
    }

    function update() {
      if (!running) return;
      if (keys['arrowleft'] || keys['a'] || keys['q']) paddle.x -= 8;
      if (keys['arrowright'] || keys['d']) paddle.x += 8;
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

      if (!launched) {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - 10;
        return;
      }

      ball.x += ball.dx; ball.y += ball.dy;
      if (ball.x - ball.r < 0 || ball.x + ball.r > W) ball.dx *= -1;
      if (ball.y - ball.r < 0) ball.dy *= -1;

      if (ball.y + ball.r > paddle.y && ball.y - ball.r < paddle.y + paddle.h &&
          ball.x > paddle.x && ball.x < paddle.x + paddle.w && ball.dy > 0) {
        ball.dy = -Math.abs(ball.dy);
        ball.dx = ((ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2)) * 6;
      }

      for (const b of bricks) {
        if (!b.alive) continue;
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
            ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
          b.alive = false;
          ball.dy *= -1;
          score += 10; scEl.textContent = score;
          break;
        }
      }

      if (bricks.every(b => !b.alive)) {
        running = false; msg.textContent = 'Niveau terminé ! 🎉 Score : ' + score;
      }

      if (ball.y > H) {
        lives--; lvEl.textContent = lives;
        if (lives <= 0) { running = false; msg.textContent = 'Game Over — Score : ' + score; }
        else { resetBall(); msg.textContent = 'Espace pour relancer'; }
      }
    }

    function draw() {
      ctx.fillStyle = '#0a0e12'; ctx.fillRect(0, 0, W, H);
      for (const b of bricks) {
        if (!b.alive) continue;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
      }
      ctx.fillStyle = '#39ff14';
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
      ctx.beginPath();
      ctx.fillStyle = '#fff';
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      paddle.x = e.clientX - rect.left - paddle.w / 2;
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
    });
    document.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === ' ') { e.preventDefault(); launch(); }
    });
    document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    document.getElementById('btn').onclick = reset;
    reset(); loop();
  </script>
</body>
</html>
