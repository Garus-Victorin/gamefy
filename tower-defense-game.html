<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Tower Defense</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Mini Tower Defense</h1>

    <div class="stats">Or: <strong id="tdGold">100</strong> | Vies: <strong id="tdLives">10</strong></div>
    <canvas id="tdCanvas" width="350" height="350" style="background:#161e27; border-radius:8px;"></canvas>
    <button class="btn" onclick="buildTower()">Placer Tourelle (50 Or)</button>
    <p class="instructions">Cliquez sur le plateau pour placer une tourelle qui détruira les monstres rouges.</p>

    </div>
    <script>

    const canvas = document.getElementById('tdCanvas');
    const ctx = canvas.getContext('2d');
    let gold = 100, lives = 10;
    let towers = [], enemies = [];

    function buildTower() {
        if (gold >= 50) {
            towers.push({ x: 175, y: 175, range: 80 });
            gold -= 50;
            document.getElementById('tdGold').textContent = gold;
        }
    }

    function updateTD() {
        if (Math.random() < 0.03) enemies.push({ x: 0, y: 175, hp: 20 });

        ctx.clearRect(0, 0, 350, 350);

        // Path
        ctx.fillStyle = '#1e2732';
        ctx.fillRect(0, 160, 350, 30);

        // Towers
        ctx.fillStyle = '#1d9bf0';
        towers.forEach(t => ctx.fillRect(t.x-10, t.y-10, 20, 20));

        // Enemies
        ctx.fillStyle = '#f75c7e';
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            e.x += 1.5;
            ctx.beginPath(); ctx.arc(e.x, e.y, 8, 0, Math.PI*2); ctx.fill();

            // Check towers range
            towers.forEach(t => {
                if (Math.hypot(e.x - t.x, e.y - t.y) < t.range) e.hp -= 0.5;
            });

            if (e.hp <= 0) {
                gold += 15;
                document.getElementById('tdGold').textContent = gold;
                enemies.splice(i, 1);
            } else if (e.x > 350) {
                lives--;
                document.getElementById('tdLives').textContent = lives;
                enemies.splice(i, 1);
            }
        }

        requestAnimationFrame(updateTD);
    }

    canvas.addEventListener('click', (e) => {
        let rect = canvas.getBoundingClientRect();
        if (gold >= 50) {
            towers.push({ x: e.clientX - rect.left, y: e.clientY - rect.top, range: 80 });
            gold -= 50;
            document.getElementById('tdGold').textContent = gold;
        }
    });

    updateTD();

    </script>
</body>
</html>
