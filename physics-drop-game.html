<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Drop</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Physics Drop</h1>

    <div class="stats">Niveau: <strong id="pdLevel">1</strong></div>
    <canvas id="pdCanvas" width="350" height="350" style="background:#161e27; border-radius:8px; cursor:crosshair;"></canvas>
    <button class="btn" onclick="initPhysicsDrop()">Réinitialiser</button>
    <p class="instructions">Dessinez des lignes avec la souris pour guider la bille bleue jusqu'au panier vert.</p>

    </div>
    <script>

    const canvas = document.getElementById('pdCanvas');
    const ctx = canvas.getContext('2d');
    let ball = { x: 50, y: 50, vx: 0, vy: 0 };
    let lines = [];
    let isDrawing = false, currentLine = [];

    function initPhysicsDrop() {
        ball = { x: 50, y: 50, vx: 0, vy: 0 };
        lines = [];
    }

    function updatePD() {
        ball.vy += 0.2; // gravity
        ball.x += ball.vx; ball.y += ball.vy;

        ctx.clearRect(0, 0, 350, 350);

        // Goal
        ctx.fillStyle = '#00ba7c';
        ctx.fillRect(280, 280, 50, 50);

        // Drawn Lines
        ctx.strokeStyle = '#e7e9ea'; ctx.lineWidth = 3;
        lines.forEach(line => {
            ctx.beginPath();
            line.forEach((p, i) => { if (i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
            ctx.stroke();
        });

        // Ball
        ctx.fillStyle = '#1d9bf0';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, 10, 0, Math.PI*2); ctx.fill();

        requestAnimationFrame(updatePD);
    }

    canvas.addEventListener('mousedown', (e) => { isDrawing = true; currentLine = []; });
    canvas.addEventListener('mousemove', (e) => {
        if (isDrawing) {
            let rect = canvas.getBoundingClientRect();
            currentLine.push({ x: e.clientX - rect.left, y: e.clientY - rect.top });
        }
    });
    canvas.addEventListener('mouseup', () => { if (isDrawing) { isDrawing = false; lines.push(currentLine); } });

    updatePD();

    </script>
</body>
</html>
