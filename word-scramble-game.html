<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mots Mêlés</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Mots Mêlés</h1>

    <div class="stats">Score: <strong id="scScore">0</strong></div>
    <div id="scrambledWord" style="font-size:2.2rem; font-weight:bold; letter-spacing:6px; color:#1d9bf0; margin:20px 0;">CODE</div>
    <input type="text" id="scInput" placeholder="Entrez le mot correct..." style="padding:10px; font-size:1.2rem; border-radius:6px; border:2px solid #273340; background:#1e2732; color:#fff; text-align:center;">
    <button class="btn" onclick="initScramble()">Changer de mot</button>
    <p class="instructions">Remettez les lettres dans l'ordre pour retrouver le mot d'origine.</p>

    </div>
    <script>

    const scWords = ["ORDINATEUR", "ALGORITHME", "PROGRAMME", "NAVIGATEUR", "JAVASCRIPT", "DEVELOPPEUR"];
    let originalWord = "", scScore = 0;

    function initScramble() {
        originalWord = scWords[Math.floor(Math.random() * scWords.length)];
        let arr = originalWord.split('').sort(() => Math.random() - 0.5);
        document.getElementById('scrambledWord').textContent = arr.join('');
        document.getElementById('scInput').value = '';
        document.getElementById('scInput').focus();
    }

    document.getElementById('scInput').addEventListener('input', (e) => {
        if (e.target.value.toUpperCase() === originalWord) {
            scScore += 100;
            document.getElementById('scScore').textContent = scScore;
            initScramble();
        }
    });

    initScramble();

    </script>
</body>
</html>
