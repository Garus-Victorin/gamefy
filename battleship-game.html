<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bataille Navale</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    .bs-cell { width:50px; height:50px; background:#273340; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; cursor:pointer; }
    .bs-cell.hit { background:#f75c7e; }
    .bs-cell.miss { background:#1d9bf0; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Bataille Navale</h1>

    <div class="stats">Tirs: <strong id="bsShots">0</strong></div>
    <div id="bsGrid" style="display:grid; grid-template-columns:repeat(5, 50px); gap:6px; background:#1e2732; padding:8px; border-radius:8px;"></div>
    <div id="bsMsg" style="height:25px; margin-top:10px; color:#00ba7c; font-size:1.1rem;"></div>
    <button class="btn" onclick="initBattleship()">Nouvelle grille</button>
    <p class="instructions">Trouvez le navire caché de 3 cases sur la grille 5x5.</p>

    </div>
    <script>

    let shipPos = [2, 7, 12];
    let shots = 0, hits = 0;

    function initBattleship() {
        shots = 0; hits = 0;
        document.getElementById('bsShots').textContent = shots;
        document.getElementById('bsMsg').textContent = '';
        renderBS();
    }

    function renderBS() {
        const grid = document.getElementById('bsGrid');
        grid.innerHTML = '';
        for (let i = 0; i < 25; i++) {
            let cell = document.createElement('div');
            cell.className = 'bs-cell';
            cell.onclick = () => {
                if (cell.classList.contains('hit') || cell.classList.contains('miss')) return;
                shots++;
                document.getElementById('bsShots').textContent = shots;
                if (shipPos.includes(i)) {
                    cell.classList.add('hit'); cell.textContent = '💥';
                    hits++;
                    if (hits === 3) document.getElementById('bsMsg').textContent = 'Tous les navires sont coulés !';
                } else {
                    cell.classList.add('miss'); cell.textContent = '🌊';
                }
            };
            grid.appendChild(cell);
        }
    }

    initBattleship();

    </script>
</body>
</html>
