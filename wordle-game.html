<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle (Français)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f1419;
            color: #e7e9ea;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { margin-bottom: 15px; color: #1d9bf0; text-align: center; }
        .game-card {
            background: #161e27;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            background: #1e2732;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .btn {
            background: #1d9bf0;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #1a8cd8; }
        .instructions { margin-top: 10px; font-size: 0.9rem; color: #8b98a5; text-align: center; }

    .w-row { display: grid; grid-template-columns: repeat(5, 50px); gap: 6px; }
    .w-tile {
        width: 50px; height: 50px; border: 2px solid #273340; display: flex;
        align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold;
        text-transform: uppercase; border-radius: 4px;
    }
    .w-tile.correct { background: #00ba7c; border-color: #00ba7c; }
    .w-tile.present { background: #ffd166; border-color: #ffd166; color: #000; }
    .w-tile.absent { background: #273340; border-color: #273340; }

    </style>
</head>
<body>
    <div class="game-card">
        <h1>Wordle (Français)</h1>

    <div id="wGrid" style="display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; margin-bottom: 15px;"></div>
    <div id="wMsg" style="height: 25px; font-size: 1.1rem; color: #00ba7c; margin-bottom: 10px;"></div>
    <button class="btn" onclick="initWordle()">Nouveau Mot</button>
    <p class="instructions">Devinez le mot de 5 lettres en 6 essais. Vert = bien placé, Jaune = mal placé.</p>

    </div>
    <script>

    const wList = ["ARBRE", "BRAVO", "CHIEN", "DONNE", "ETOILE", "FLEUR", "GRAND", "HIBOU", "IMAGE", "JOUER", "LIVRE", "MONDE", "NUAGE", "PLAGE", "TABLE"];
    let targetWord = "", currentRow = 0, currentTile = 0, guesses = Array(6).fill("").map(() => Array(5).fill(""));

    function initWordle() {
        targetWord = wList[Math.floor(Math.random() * wList.length)];
        currentRow = 0; currentTile = 0;
        guesses = Array(6).fill("").map(() => Array(5).fill(""));
        document.getElementById('wMsg').textContent = '';
        renderWGrid();
    }

    function renderWGrid() {
        const grid = document.getElementById('wGrid');
        grid.innerHTML = '';
        for (let r = 0; r < 6; r++) {
            let rowDiv = document.createElement('div');
            rowDiv.className = 'w-row';
            for (let c = 0; c < 5; c++) {
                let tile = document.createElement('div');
                tile.className = 'w-tile';
                tile.textContent = guesses[r][c];
                rowDiv.appendChild(tile);
            }
            grid.appendChild(rowDiv);
        }
    }

    document.addEventListener('keydown', (e) => {
        if (currentRow >= 6) return;
        if (e.key === 'Enter') {
            if (currentTile === 5) checkWordleRow();
        } else if (e.key === 'Backspace') {
            if (currentTile > 0) {
                currentTile--;
                guesses[currentRow][currentTile] = "";
                renderWGrid();
            }
        } else if (/^[a-zA-Z]$/.test(e.key)) {
            if (currentTile < 5) {
                guesses[currentRow][currentTile] = e.key.toUpperCase();
                currentTile++;
                renderWGrid();
            }
        }
    });

    function checkWordleRow() {
        let guess = guesses[currentRow].join('');
        let rowTiles = document.getElementById('wGrid').children[currentRow].children;
        let targetArr = targetWord.split('');

        for (let i = 0; i < 5; i++) {
            if (guess[i] === targetArr[i]) {
                rowTiles[i].classList.add('correct');
                targetArr[i] = null;
            }
        }

        for (let i = 0; i < 5; i++) {
            if (!rowTiles[i].classList.contains('correct')) {
                let idx = targetArr.indexOf(guess[i]);
                if (idx !== -1) {
                    rowTiles[i].classList.add('present');
                    targetArr[idx] = null;
                } else {
                    rowTiles[i].classList.add('absent');
                }
            }
        }

        if (guess === targetWord) {
            document.getElementById('wMsg').textContent = 'Bravo ! Mot trouvé !';
            currentRow = 6;
        } else {
            currentRow++;
            currentTile = 0;
            if (currentRow === 6) document.getElementById('wMsg').textContent = 'Perdu ! Le mot était : ' + targetWord;
        }
    }

    initWordle();

    </script>
</body>
</html>
